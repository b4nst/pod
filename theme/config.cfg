# pod defaults. Rockbox rewrites this file when settings change.
wps: /.rockbox/wps/pod.wps
sbs: /.rockbox/wps/pod.sbs
font: /.rockbox/fonts/11-JetBrainsMono.fnt
statusbar: top
scrollbar: off
show icons: off
iconset: -
viewers iconset: -
backdrop: -
ui viewport: -
selector type: bar (inverse)

# library
tagcache_autoupdate: on
tagcache_ram: on
dircache: on

# no voice, no queue/shuffle submenus in the context menu
talk menu: off
show queue options: off
show shuffled adding options: off
hold_lr_for_scroll_in_list: off

backlight timeout: 15

# EQ: five bands, the rest stay at 0 dB (disabled in the DSP)
eq enabled: off
eq precut: 0
eq filter 0: 60, 7, 0, LOW_SHELF
eq filter 1: 250, 10, 0, PEAK
eq filter 2: 1000, 10, 0, PEAK
eq filter 3: 4000, 10, 0, PEAK
eq filter 4: 12000, 7, 0, HIGH_SHELF
eq filter 5: 4000, 10, 0, PEAK
eq filter 6: 4000, 10, 0, PEAK
eq filter 7: 4000, 10, 0, PEAK
eq filter 8: 4000, 10, 0, PEAK
eq filter 9: 16000, 7, 0, HIGH_SHELF
